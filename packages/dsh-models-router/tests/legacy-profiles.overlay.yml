# Regression fixture: the oldest config shape, exactly as a real user still has it.
#
# No `chain` and no `chains` key — the whole routing config is `profiles[]` (one
# entry per selected model, `candidates[0]` pinned) plus the `default` pool. The
# Host must migrate this to one named chain and keep routing; before the fix it
# read the schema-stamped empty `chain` instead and silently stopped taking over.
#
# Loaded by the `legacy-profiles-config-keeps-routing` scenario in run.mjs, which
# copies this file over the generated overlay of the same name.

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- id: agent-default-model
  config:
    provider: stub-primary
    model: stub-model

- insert:
    - id: stub-adapter
      name: 'D:/sudy/myproject/dsh-model-router/packages/dsh-models-router/tests/stub-adapter.mjs'
    - id: model-router
      name: 'D:/sudy/myproject/dsh-model-router/packages/dsh-models-router/lib/index.js'
      config:
        enabled: true
        profiles:
          - id: profile-1
            when: { provider: stub-primary, model: stub-model }
            candidates:
              # candidates[0] is the pinned "when" model: it is the implicit first
              # hop now, so only its call count is read (maxAttempts: 1 = no retry).
              - { provider: stub-primary, model: stub-model, maxAttempts: 1, weight: 0, needs: {} }
              - { provider: stub-backup, model: stub-model, maxAttempts: 1, weight: 0, needs: {} }
            switchOn: { rateLimit: true, server: true, timeout: true, transport: true, emptyResponse: false, invalidRequest: false }
            maxTotalAttempts: 6
            stickyTurns: 0
            strategy: order
        default:
          enabled: true
          candidates:
            - { provider: stub-third, model: stub-model, maxAttempts: 1, weight: 0, needs: {} }
          switchOn: { rateLimit: true, server: true, timeout: true, transport: true, emptyResponse: false, invalidRequest: false }
          maxTotalAttempts: 3
          stickyTurns: 0
