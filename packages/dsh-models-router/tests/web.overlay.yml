# Boot the web profile with the router bundle installed, on the default port.
#
# Beyond the adapter disables, this injects the deterministic stub adapter and
# points the default selection at it, and patches the installed bundle's row
# config (the row already exists from `dsh plugin add`; patching — not
# re-inserting — keeps the browser half attached to the bare-package-name row).
# A chat turn then fails over for real, which is what the failover-history
# drawer reads.

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: agent-default-model
  config:
    provider: stub-primary
    model: stub-model

- id: model-router
  config:
    enabled: true
    profiles:
      - id: p1
        when: { provider: stub-primary, model: stub-model }
        candidates:
          - { provider: stub-primary, model: stub-model, maxAttempts: 2 }
          - { provider: stub-backup, model: stub-model, maxAttempts: 1 }
        switchOn: { rateLimit: true, server: true, timeout: true, transport: true, emptyResponse: false, invalidRequest: false }
        maxTotalAttempts: 6
    default:
      enabled: false
      candidates: []
      switchOn: { rateLimit: true, server: true, timeout: true, transport: true, emptyResponse: false, invalidRequest: false }
      maxTotalAttempts: 3

- insert:
    - id: stub-adapter
      name: 'D:/sudy/myproject/dsh-model-router/packages/dsh-models-router/tests/stub-adapter.mjs'
